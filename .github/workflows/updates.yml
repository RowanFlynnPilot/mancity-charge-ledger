name: Fetch updates

# Reads the news feeds every hour and commits feed/updates.json if it changed.
# A failed run is the alert that a feed is down or has changed shape.
#
# Hourly, because GitHub drops scheduled runs when it is busy: on a three-hour
# schedule the gaps reached eight hours, longer than the shortest feed holds its
# items. A run that finds nothing new commits nothing and deploys nothing.
#
# GitHub's own schedule went five hours without firing even when hourly, so the
# runs that count come from outside: cron-job.org calls the workflow_dispatch
# endpoint at 47 minutes past each hour (see CLAUDE.md). The schedule below
# stays as a second source; a run it adds does no harm.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python pipeline/fetch_updates.py
      - run: python pipeline/validate.py
      - id: commit
        run: |
          if git diff --quiet -- feed/updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update press coverage feed" -- feed/updates.json
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with the workflow's own token does not start other workflows,
  # so the site is rebuilt from here.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
