name: Check source links

# Requests every source the record cites, once a week. A failed run is the
# alert that a document has moved or gone. It also runs when the checker itself
# changes, so a change to it is tried before it is merged.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - pipeline/check_links.py
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python pipeline/check_links.py
